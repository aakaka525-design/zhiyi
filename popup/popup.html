<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <title>智译翻译</title>
  <link rel="stylesheet" href="../options/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <!-- 头部 -->
    <header class="popup-header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path
            d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
        </svg>
        <span class="logo-text">智译</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon tooltip" data-tooltip="历史记录" id="btn-history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </button>
        <button class="btn-icon tooltip" data-tooltip="设置" id="btn-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 语言选择器 -->
    <div class="language-selector">
      <select class="input select" id="source-lang">
        <option value="auto">自动检测</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
      <button class="btn-icon swap-btn" id="btn-swap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4" />
        </svg>
      </button>
      <select class="input select" id="target-lang">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
    </div>

    <!-- 输入区域 -->
    <div class="input-section">
      <textarea class="input textarea" id="source-text" placeholder="输入要翻译的文本..." rows="4"></textarea>
      <div class="input-actions">
        <button class="btn-icon tooltip" data-tooltip="清空" id="btn-clear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
        <button class="btn-icon tooltip" data-tooltip="粘贴" id="btn-paste">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
        </button>
        <span class="char-count" id="char-count">0 / 5000</span>
      </div>
    </div>

    <!-- 翻译按钮 -->
    <button class="btn btn-primary translate-btn" id="btn-translate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2v3M22 22l-5-10-5 10M14 18h6" />
      </svg>
      翻译
    </button>

    <!-- 结果区域 -->
    <div class="result-section" id="result-section">
      <div class="result-header">
        <span class="result-label">翻译结果</span>
        <div class="result-actions">
          <button class="btn-icon tooltip" data-tooltip="朗读" id="btn-speak">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            </svg>
          </button>
          <button class="btn-icon tooltip" data-tooltip="复制" id="btn-copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <rect x="9" y="9" width="13" height="13" rx="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
          </button>
          <button class="btn-icon tooltip" data-tooltip="收藏" id="btn-favorite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="result-content" id="result-content">
        <div class="result-placeholder">翻译结果将显示在这里</div>
      </div>
    </div>

    <!-- 快捷功能 -->
    <div class="quick-actions">
      <button class="quick-btn" id="btn-immersive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <line x1="8" y1="21" x2="16" y2="21" />
          <line x1="12" y1="17" x2="12" y2="21" />
        </svg>
        <span>沉浸翻译</span>
      </button>
      <button class="quick-btn" id="btn-sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
        <span>侧边栏</span>
      </button>
      <button class="quick-btn" id="btn-float">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="M8 4v4h8V4"></path>
          <path d="M2 8h20"></path>
        </svg>
        <span>悬浮窗</span>
      </button>
    </div>


    <!-- 服务状态 -->
    <footer class="popup-footer">
      <div class="service-indicator">
        <span class="status-dot active"></span>
        <span class="service-name" id="current-service">-</span>
      </div>
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
